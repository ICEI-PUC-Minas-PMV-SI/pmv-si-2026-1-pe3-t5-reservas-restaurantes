<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Reserva Fácil | Criar conta</title>

  <link rel="icon" type="image/png" href="../assets/img/favicon-logo.png" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/pages/dashboard.css" />
  <link rel="stylesheet" href="../css/pages/auth.css" />
  <link rel="stylesheet" href="../css/components/form.css" />
</head>

<body>
  <header class="auth-navbar">
    <a href="../index.html" class="auth-brand">
      <img src="../assets/img/logo-reserva-facil.png"
        alt="Reserva Fácil"
        class="system-logo">
      <strong>Reserva Fácil</strong>
    </a>

    <a href="../index.html" class="btn-secondary auth-back-link">
      Voltar ao início
    </a>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <span class="auth-eyebrow">Comece agora</span>

      <h1>Criar conta</h1>

      <p class="auth-subtitle">
        Cadastre-se como cliente ou restaurante para usar o Reserva Fácil.
      </p>

      <div class="role-selector">
        <button class="role-btn active" data-role="client" type="button">Cliente</button>
        <button class="role-btn" data-role="admin" type="button">Restaurante</button>
      </div>

      <form id="registerForm">
        <input type="text" id="firstName" placeholder="Nome" required />
        <input type="text" id="lastName" placeholder="Sobrenome" required />
        <input type="number" id="age" placeholder="Idade" required />
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Senha" required />

        <button type="submit" class="btn auth-submit-btn">Cadastrar</button>
      </form>

      <p class="auth-switch-text">
        Já tem conta?
        <a href="./login.html">Entrar</a>
      </p>
    </section>
  </main>

  <script type="module" src="../js/controllers/authController.js"></script>
</body>
</html>
