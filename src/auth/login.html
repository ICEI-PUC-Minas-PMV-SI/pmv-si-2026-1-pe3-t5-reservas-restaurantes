<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Reserva Fácil | Entrar</title>

  <link rel="icon" type="image/png" href="../assets/img/favicon-logo.png" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/pages/dashboard.css" />
  <link rel="stylesheet" href="../css/pages/auth.css" />
  <link rel="stylesheet" href="../css/components/form.css" />
</head>

<body>
  <header class="auth-navbar">
    <a href="../index.html" class="auth-brand">
      <img src="../assets/img/logo-reserva-facil.png"
        alt="Reserva Fácil"
        class="system-logo">
      <strong>Reserva Fácil</strong>
    </a>

    <a href="../index.html" class="btn-secondary auth-back-link">
      Voltar ao início
    </a>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <span class="auth-eyebrow">Acesse sua conta</span>

      <h1>Entrar</h1>

      <p class="auth-subtitle">
        Entre como cliente ou restaurante para gerenciar suas reservas.
      </p>

      <div class="role-selector">
        <button class="role-btn active" data-role="client" type="button">Sou Cliente</button>
        <button class="role-btn" data-role="admin" type="button">Sou Restaurante</button>
      </div>

      <form id="loginForm">
        <input type="email" id="email" placeholder="Seu email" required />
        <input type="password" id="password" placeholder="Sua senha" required />

        <button type="submit" class="btn auth-submit-btn">Entrar</button>
      </form>

      <p class="auth-switch-text">
        Não tem conta?
        <a href="./register.html">Criar conta</a>
      </p>
    </section>
  </main>

  <script type="module" src="../js/controllers/authController.js"></script>
</body>
</html>
